databaseChangeLog:
  - changeSet:
      id: 001-officium-schema
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create extension if not exists pgcrypto;

              create table if not exists officium_folder (
                id uuid primary key default gen_random_uuid(),
                owner_account_id uuid not null,
                parent_id uuid references officium_folder(id) on delete restrict,
                name text not null,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now()
              );
              create index if not exists idx_officium_folder_owner on officium_folder(owner_account_id);

              create table if not exists officium_project (
                id uuid primary key default gen_random_uuid(),
                owner_account_id uuid not null,
                folder_id uuid references officium_folder(id) on delete set null,
                name text not null,
                key_prefix text not null,
                archived_at timestamptz,
                version int not null default 1,
                next_card_number int not null default 1,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                unique (owner_account_id, key_prefix)
              );
              create index if not exists idx_officium_project_owner on officium_project(owner_account_id);
              create index if not exists idx_officium_project_folder on officium_project(folder_id);

              create table if not exists officium_project_member (
                project_id uuid not null references officium_project(id) on delete cascade,
                account_id uuid not null,
                role text not null,
                created_at timestamptz not null default now(),
                primary key (project_id, account_id)
              );

              create table if not exists officium_card (
                id uuid primary key default gen_random_uuid(),
                project_id uuid not null references officium_project(id) on delete cascade,
                key text not null,
                number int not null,
                title text not null,
                description text,
                status text not null,
                run_state text not null,
                priority text not null,
                executor text not null,
                card_order int not null,
                estimate double precision not null default 0,
                epic text,
                tags text[] not null default '{}',
                assignees jsonb not null default '[]',
                version int not null default 1,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now(),
                created_by jsonb not null,
                updated_by jsonb not null,
                deleted_at timestamptz,
                client_key text,
                unique (project_id, key),
                unique (project_id, client_key)
              );
              create index if not exists idx_officium_card_project_status_order
                  on officium_card(project_id, status, card_order);
              create index if not exists idx_officium_card_project_epic on officium_card(project_id, epic);

              create table if not exists officium_card_link (
                id uuid primary key default gen_random_uuid(),
                project_id uuid not null references officium_project(id) on delete cascade,
                type text not null,
                source_card_id uuid not null references officium_card(id) on delete cascade,
                target_card_id uuid not null references officium_card(id) on delete cascade,
                source_card_key text not null,
                target_card_key text not null,
                unique (project_id, type, source_card_id, target_card_id)
              );
              create index if not exists idx_officium_card_link_source on officium_card_link(source_card_id);
              create index if not exists idx_officium_card_link_target on officium_card_link(target_card_id);

              create table if not exists officium_card_comment (
                id uuid primary key default gen_random_uuid(),
                card_id uuid not null references officium_card(id) on delete cascade,
                author jsonb not null,
                text text not null,
                created_at timestamptz not null default now(),
                updated_at timestamptz not null default now()
              );
              create index if not exists idx_officium_card_comment_card on officium_card_comment(card_id);

              create table if not exists officium_card_time_entry (
                id uuid primary key default gen_random_uuid(),
                card_id uuid not null references officium_card(id) on delete cascade,
                entry_date date not null,
                hours double precision not null,
                who text not null,
                account_id uuid,
                note text,
                created_at timestamptz not null default now()
              );
              create index if not exists idx_officium_time_entry_card on officium_card_time_entry(card_id);

              create table if not exists officium_card_attachment (
                id uuid primary key default gen_random_uuid(),
                card_id uuid not null references officium_card(id) on delete cascade,
                name text not null,
                size bigint not null,
                content_type text not null,
                storage_key text not null,
                created_at timestamptz not null default now()
              );
              create index if not exists idx_officium_attachment_card on officium_card_attachment(card_id);

              create table if not exists officium_activity (
                id uuid primary key default gen_random_uuid(),
                project_id uuid not null references officium_project(id) on delete cascade,
                card_id uuid,
                card_key text,
                actor jsonb not null,
                operation text not null,
                summary text not null,
                at timestamptz not null default now()
              );
              create index if not exists idx_officium_activity_project_at on officium_activity(project_id, at desc);
              create index if not exists idx_officium_activity_card on officium_activity(card_id);
