databaseChangeLog:
  # JAVA-132: the documentation's drift control. Every change that reaches main is an entry, pending
  # until someone says what the docs did about it; `ref` (the commit) keeps a retried pipeline from
  # writing it twice. The token table holds one hash per project, never the token. Both go with the
  # project, so deleting it or purging its owner's account takes them too.
  - changeSet:
      id: 010-documentation-changelog
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create table if not exists officium_changelog_entry (
                id uuid primary key,
                project_id uuid not null references officium_project(id) on delete cascade,
                ref text not null,
                title text not null,
                url text,
                areas text[] not null default '{}',
                merged_at timestamptz not null,
                status text not null default 'pending' check (status in ('pending', 'reviewed', 'updated')),
                pages text[] not null default '{}',
                recorded_by jsonb not null,
                recorded_at timestamptz not null,
                marked_by jsonb,
                marked_at timestamptz,
                version int not null default 1
              );
              create unique index if not exists uq_officium_changelog_entry_ref
                on officium_changelog_entry (project_id, ref);
              create index if not exists ix_officium_changelog_entry_merged
                on officium_changelog_entry (project_id, merged_at desc);
              create table if not exists officium_changelog_token (
                project_id uuid primary key references officium_project(id) on delete cascade,
                token_hash text not null unique,
                created_by jsonb not null,
                created_at timestamptz not null
              );
