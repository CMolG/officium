databaseChangeLog:
  # JAVA-766: a project's test-run history. One row per full run its runner posts (with the
  # project's pipeline token, the changelog's), keyed by (machine, started_at) so a retried post
  # never writes it twice; one row per suite in it. Both go with the project, so deleting it or
  # purging its owner's account takes them too. Expand only: new tables, nothing the running
  # release reads.
  - changeSet:
      id: 021-test-history
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create table if not exists officium_test_run (
                id uuid primary key,
                project_id uuid not null references officium_project(id) on delete cascade,
                ref text not null,
                branch text not null default '',
                machine text not null default '',
                started_at timestamptz not null,
                finished_at timestamptz,
                recorded_by jsonb not null,
                recorded_at timestamptz not null
              );
              create unique index if not exists uq_officium_test_run_key
                on officium_test_run (project_id, machine, started_at);
              create index if not exists ix_officium_test_run_started
                on officium_test_run (project_id, started_at desc);
              create table if not exists officium_test_suite_result (
                run_id uuid not null references officium_test_run(id) on delete cascade,
                position int not null,
                name text not null,
                ok boolean not null,
                seconds double precision not null,
                primary key (run_id, position)
              );
