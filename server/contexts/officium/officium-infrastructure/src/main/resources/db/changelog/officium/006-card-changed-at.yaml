databaseChangeLog:
  # JAVA-45 (user report, 2026-09-24): the board reloaded every card on every event. It now keeps
  # a copy and asks only for what changed since it (`GET .../cards/changes?since=`), which needs a
  # marker that moves whenever what a card LOOKS like on the board moves -- and `updated_at` is not
  # it: a neighbour renumbered by a move keeps it, and a card's `blocked`, `blocks`, `blockedBy` and
  # `related` change when ANOTHER card moves, links or unlinks, or is deleted.
  #
  # Triggers, not Java: the writes that change a row live in three repositories and a batch writer,
  # and a marker set by hand in each is one forgotten call away from a board that silently stops
  # updating. `clock_timestamp()`, not `now()`: `now()` is the transaction's START, so a slow write
  # would stamp a time a reader may already have passed (the server also re-reads a minute back).
  - changeSet:
      id: 006-card-changed-at
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              alter table officium_card add column if not exists changed_at timestamptz not null default now();
              create index if not exists idx_officium_card_changed on officium_card (project_id, changed_at);
        - sql:
            splitStatements: false
            sql: |
              create or replace function officium_card_mark_changed() returns trigger language plpgsql as $$
              begin
                -- A renumbering that leaves a card where it was is not a change to it.
                if tg_op = 'INSERT' or new is distinct from old then
                  new.changed_at := clock_timestamp();
                end if;
                return new;
              end $$;
        - sql:
            splitStatements: false
            sql: |
              create or replace function officium_card_touch_blocked() returns trigger language plpgsql as $$
              begin
                if new.status is distinct from old.status or new.deleted_at is distinct from old.deleted_at then
                  update officium_card set changed_at = clock_timestamp()
                   where id in (select target_card_id from officium_card_link
                                 where source_card_id = new.id and type = 'BLOCKS');
                end if;
                return null;
              end $$;
        - sql:
            splitStatements: false
            sql: |
              create or replace function officium_card_link_touch() returns trigger language plpgsql as $$
              begin
                if tg_op = 'DELETE' then
                  update officium_card set changed_at = clock_timestamp()
                   where id in (old.source_card_id, old.target_card_id);
                else
                  update officium_card set changed_at = clock_timestamp()
                   where id in (new.source_card_id, new.target_card_id);
                end if;
                return null;
              end $$;
        - sql:
            sql: |
              drop trigger if exists officium_card_changed on officium_card;
              create trigger officium_card_changed before insert or update on officium_card
                for each row execute function officium_card_mark_changed();
              drop trigger if exists officium_card_blocked_changed on officium_card;
              create trigger officium_card_blocked_changed after update on officium_card
                for each row execute function officium_card_touch_blocked();
              drop trigger if exists officium_card_link_changed on officium_card_link;
              create trigger officium_card_link_changed after insert or delete on officium_card_link
                for each row execute function officium_card_link_touch();
