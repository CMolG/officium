databaseChangeLog:
  # JAVA-794: the versions a page used to be (the heaviest ever plus the two latest previous ones)
  # and each project's history window. Expand only: the previous release ignores both tables.
  - changeSet:
      id: 036-doc-history
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create table if not exists officium_doc_revision (
                id uuid primary key,
                project_id uuid not null references officium_project(id) on delete cascade,
                page_id uuid not null references officium_doc_page(id) on delete cascade,
                version int not null,
                title text not null,
                body text not null default '',
                weight_bytes bigint not null,
                author jsonb not null,
                written_at timestamptz not null,
                retired_at timestamptz not null,
                heaviest boolean not null default false
              );
              create unique index if not exists uq_officium_doc_revision_version
                on officium_doc_revision (page_id, version);
              create index if not exists ix_officium_doc_revision_retired
                on officium_doc_revision (retired_at) where not heaviest;
              create index if not exists ix_officium_doc_revision_project
                on officium_doc_revision (project_id);
              create table if not exists officium_doc_settings (
                project_id uuid primary key references officium_project(id) on delete cascade,
                history_days int not null default 15 check (history_days between 0 and 3650),
                version int not null default 1,
                updated_by jsonb not null,
                updated_at timestamptz not null
              );
