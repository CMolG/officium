databaseChangeLog:
  # User request, 2026-09-23 (JAVA-28): what kind of work a card is. Nullable and not backfilled:
  # no existing card has one, and "not classified" is the truth about them until someone does it
  # (JAVA-31). Plain text like `status` and `priority`, whose vocabularies live in the domain's
  # enums rather than in a check constraint that would need a migration for every new value --
  # which is also why the Completed status (`done`, JAVA-29) needs no changeset at all.
  - changeSet:
      id: 005-card-category
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              alter table officium_card add column if not exists category text;
