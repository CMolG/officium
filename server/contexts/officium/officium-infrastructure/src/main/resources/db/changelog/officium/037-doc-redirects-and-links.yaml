databaseChangeLog:
  # JAVA-792: where a moved page used to live, and which pages point at which paths. Expand only:
  # the previous release ignores both tables and the nullable column.
  - changeSet:
      id: 037-doc-redirects-and-links
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create table if not exists officium_doc_redirect (
                project_id uuid not null references officium_project(id) on delete cascade,
                from_path text not null,
                page_id uuid not null references officium_doc_page(id) on delete cascade,
                created_at timestamptz not null default now(),
                primary key (project_id, from_path)
              );
              create index if not exists ix_officium_doc_redirect_page on officium_doc_redirect (page_id);
              create table if not exists officium_doc_link (
                project_id uuid not null references officium_project(id) on delete cascade,
                from_page_id uuid not null references officium_doc_page(id) on delete cascade,
                to_path text not null,
                line int not null default 0,
                primary key (from_page_id, to_path)
              );
              create index if not exists ix_officium_doc_link_target on officium_doc_link (project_id, to_path);
              alter table officium_doc_page add column if not exists links_version int;
              create index if not exists ix_officium_doc_page_unindexed on officium_doc_page (id)
                where links_version is distinct from version;
