databaseChangeLog:
  # JAVA-894: a human card is answered with a Quaestio form. `officium_card_form` links a card to its
  # form (one per card, and one card per form), and `officium_card_form_answer` keeps every answer the
  # form took, one row per completed response, so a card sent back to To do keeps the history of what
  # was said. `form_id` carries no foreign key on purpose: the form belongs to the forms context.
  # Expand only: two new tables the previous release never reads.
  - changeSet:
      id: 026-card-forms
      author: javadaba
      context: default
      changes:
        - sql:
            sql: |
              create table if not exists officium_card_form (
                id uuid primary key,
                project_id uuid not null references officium_project(id) on delete cascade,
                card_id uuid not null references officium_card(id) on delete cascade,
                form_id uuid not null,
                slug text not null,
                question_count int not null,
                created_at timestamptz not null default now(),
                unique (card_id),
                unique (form_id)
              );

              create table if not exists officium_card_form_answer (
                id uuid primary key,
                card_form_id uuid not null references officium_card_form(id) on delete cascade,
                response_id uuid not null unique,
                respondent_account_id uuid not null,
                respondent_name text not null,
                answers jsonb not null,
                answered_at timestamptz not null
              );
              create index if not exists idx_officium_card_form_answer_form
                on officium_card_form_answer(card_form_id, answered_at);
      rollback:
        - sql:
            sql: |
              drop table if exists officium_card_form_answer;
              drop table if exists officium_card_form;
